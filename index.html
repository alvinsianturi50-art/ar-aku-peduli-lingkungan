<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Aku Peduli Lingkungan</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
  body { margin:0; font-family:Arial,sans-serif; }
  #info {
    position:fixed; top:12px; left:12px; right:12px; z-index:10;
    background:rgba(255,255,255,.92); border-radius:14px; padding:12px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:15px;
  }
</style>
</head>
<body>
<div id="info">
  <b>AR: Aku Peduli Lingkungan</b><br>
  Arahkan kamera ke <b>Hiro Marker</b>. Saat terdeteksi, akan muncul taman sekolah,
  tempat sampah, dan pesan peduli lingkungan.
</div>

<a-scene embedded vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true;"
  arjs="sourceType: webcam; debugUIEnabled:false;">

  <a-marker preset="hiro">
    <!-- tanah/taman -->
    <a-box position="0 0.02 0" width="2.2" height="0.04" depth="2.2" color="#8BC34A"></a-box>

    <!-- pohon -->
    <a-cylinder position="-0.55 0.65 0" radius="0.12" height="1.1" color="#795548"></a-cylinder>
    <a-sphere position="-0.55 1.25 0" radius="0.45" color="#43A047"></a-sphere>
    <a-sphere position="-0.25 1.15 0.1" radius="0.32" color="#66BB6A"></a-sphere>

    <!-- tempat sampah -->
    <a-box position="0.55 0.32 0" width="0.45" height="0.6" depth="0.45" color="#2196F3"></a-box>
    <a-cylinder position="0.55 0.64 0" radius="0.25" height="0.06" color="#1565C0"></a-cylinder>

    <!-- bunga -->
    <a-cylinder position="0.15 0.22 0.45" radius="0.025" height="0.3" color="#2E7D32"></a-cylinder>
    <a-sphere position="0.15 0.39 0.45" radius="0.11" color="#EC407A"></a-sphere>

    <!-- papan pesan -->
    <a-box position="0 0.8 -0.65" width="1.6" height="0.65" depth="0.05" color="#FFF3CD"></a-box>
    <a-text value="JAGA LINGKUNGAN!\nBuang sampah pada tempatnya"
      position="0 0.82 -0.69" rotation="0 0 0" align="center"
      color="#333" width="1.45" wrap-count="28"></a-text>

    <!-- panah kecil ke tempat sampah -->
    <a-cone position="0.55 0.95 0" radius-bottom="0.10" radius-top="0"
      height="0.22" rotation="0 0 180" color="#1565C0"></a-cone>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
